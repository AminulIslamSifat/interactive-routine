<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Interactive Routine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="routine">

  <!-- ═══ ACTIVITY RAIL ═══ -->
  <div class="rail">
    <div class="rail-group">
      <button class="rail-btn active" data-view="routine" title="Class Routine">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </button>
      <button class="rail-btn" data-view="schedule" title="Schedule">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      </button>
      <button class="rail-btn" data-view="personal" title="Personal Routine">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </button>
    </div>
    <div class="rail-group">
      <button class="rail-btn" data-view="settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══ SIDEBAR ═══ -->
  <div class="sidebar">
    <div class="sb-head">
      <h3 id="sbTitle">Class Routine</h3>
      <p id="sbSubtitle">Loading...</p>
    </div>
    <div class="sb-body" id="sbBody"></div>
  </div>

  <!-- ═══ VIEW: CLASS ROUTINE ═══ -->
  <div class="main" id="viewRoutine">
    <div class="main-header">
      <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Class Routine
      </h2>
      <span id="routineSectionLabel" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div class="main-body" id="routineBody">
      <div class="empty-state"><p>Loading routine...</p></div>
    </div>
  </div>

  <!-- ═══ VIEW: SCHEDULE ═══ -->
  <div class="main" id="viewSchedule">
    <div class="main-header">
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <span class="cal-title" id="calTitle">September 2026</span>
        <button id="calNext">›</button>
        <button id="calToday" style="width:auto;padding:0 10px;font-size:11px">Today</button>
      </div>
    </div>
    <div class="main-body" style="display:flex;flex-direction:column">
      <div class="cal-weekdays">
        <span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- ═══ VIEW: SETTINGS ═══ -->
  <div class="main" id="viewSettings">
    <div class="sidebar" id="settingsSidebar">
      <div class="sb-title">Settings</div>
      <div class="sb-body" id="settingsNav"></div>
    </div>
    <div class="main-area">
      <div class="main-body" id="settingsBody">
        <!-- Dynamic settings content -->
      </div>
    </div>
  </div>

  <!-- ═══ VIEW: PERSONAL ROUTINE ═══ -->
  <div class="main" id="viewPersonal">
    <div class="main-header">
      <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Personal Routine
      </h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="personalAddBtn">+ Add</button>
        <button class="btn" id="personalEditBtn">Edit</button>
      </div>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
    <div class="main-body" id="personalBody">
      <div class="empty-state"><p>No items yet. Use + Add to create one.</p></div>
    </div>
  </div>

  <!-- ═══ MODAL (First login / Schedule popup / Edit) ═══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
